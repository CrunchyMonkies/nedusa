name: cache-deps
description: Installs monorepo dependencies with pnpm, caching the pnpm store
inputs:
  extension:
    description: Extension for cache name
  skip-build:
    description: Skip build step (default false)
    default: "false"
runs:
  using: composite
  steps:
    # Ported from yarn berry. Notes on the changes:
    #   - The old action cached `.yarn/cache`, `node_modules` and `.pnp.*`, keyed on
    #     yarn.lock. pnpm's content-addressable store is the thing worth caching; the
    #     node_modules tree is cheap to relink from it.
    #   - `--immutable` becomes `--frozen-lockfile`.
    #   - The old action only installed on a cache MISS, which is wrong for pnpm: a
    #     warm store still needs the link step to materialise node_modules. Install
    #     always; a warm store makes it fast.
    - uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ inputs.extension }}-v1-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-${{ inputs.extension }}-v1-

    - run: pnpm install --frozen-lockfile
      shell: bash

    # Explicit, not just the root postinstall: pnpm short-circuits lifecycle scripts when
    # an install is a no-op (warm cache + unchanged lockfile), and this step must run on
    # every job or TypeScript declaration emit fails with TS2742.
    # See tools/pnpm/flatten-workspace-links.js and docs/porting/06-pnpm-conventions.md.
    - run: pnpm run pnpm:flatten
      shell: bash

    - run: pnpm build
      shell: bash
      if: ${{ inputs.skip-build != 'true' }}
